<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HelpDesk Web - SPA</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        /* Efeito de piscar usado na prioridade Alta. */
        @keyframes piscar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }

        .badge-piscando {
            animation: piscar 1s infinite;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#" data-view="dashboard">
                HelpDesk Web
            </a>

            <div class="navbar-nav">
                <a class="nav-link" href="#" data-view="dashboard">
                    Dashboard
                </a>

                <a class="nav-link" href="#" data-view="chamados">
                    Chamados
                </a>

                <a class="nav-link" href="#" data-view="novo">
                    Novo chamado
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div id="app"></div>
    </main>

    <script src="app.js"></script>
</body>

</html>
